    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, '')
        var redirectPaths = {
          '/tools': '/tools/',
          '/spotify': '/spotify/',
          '/youtube': '/youtube/',
          '/instagram': '/instagram/',
          '/tiktok': '/tiktok/',
          '/soundcloud': '/soundcloud/',
          '/buymeacoffee': '/buymeacoffee/',
          '/patreon': '/patreon/',
          '/discord': '/discord/',
        }
        if (redirectPaths[path]) {
          window.location.replace(redirectPaths[path])
          return
        }

        var hash = window.location.hash.replace(/^#/, '').toLowerCase()
        var redirectHashes = {
          youtube: '/youtube/',
          spotify: '/spotify/',
          instagram: '/instagram/',
          tiktok: '/tiktok/',
          soundcloud: '/soundcloud/',
          buymeacoffee: '/buymeacoffee/',
          patreon: '/patreon/',
          discord: '/discord/',
        }
        if ((path === '' || path === '/') && redirectHashes[hash]) {
          window.location.replace(redirectHashes[hash])
        }
      })();
    </script>
